# ============================================================
#  Docker Compose - AI Anti-Fraud Detection System
#  AI反诈骗检测系统 - 一键部署
# ============================================================
# Usage:
#   docker compose up -d          # 启动全部服务
#   docker compose down           # 停止全部服务
#   docker compose logs -f        # 查看日志
# ============================================================

name: anti-fraud

services:
  # ============================================================
  #  MySQL Database
  #  MySQL 数据库
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: anti-fraud-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: anti_fraud
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/anti_fraud.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Agent tables for fresh volumes; existing volumes need the manual migration in docs
      - ./sql/migrations/V001__agent_core.sql:/docker-entrypoint-initdb.d/02-agent-core.sql:ro
      - ./sql/migrations/V002__agent_human_review.sql:/docker-entrypoint-initdb.d/03-agent-review.sql:ro
      - ./sql/migrations/V003__seed_roles.sql:/docker-entrypoint-initdb.d/04-seed-roles.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  Redis Cache
  #  Redis 缓存
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: anti-fraud-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi'
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  Python AI Detection Service
  #  Python AI检测微服务
  # ============================================================
  ai-service:
    image: anti-fraud-ai:local
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: anti-fraud-ai
    restart: unless-stopped
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=5000
      - AI_SERVICE_DEBUG=false
    depends_on:
      - redis
    ports:
      - "5000:5000"
    volumes:
      - ./ai-service:/app/ai-service:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  #  Java Backend
  #  Java 后端服务
  # ============================================================
  agent-service:
    image: anti-fraud-agent:local
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: anti-fraud-agent
    restart: unless-stopped
    environment:
      AGENT_SERVICE_TOKEN: "${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}"
      BACKEND_EVENT_URL: http://backend:9090/internal/agent/v1/runs
      AI_SERVICE_URL: http://ai-service:5000
      CHECKPOINT_DB_PATH: /data/agent-checkpoints.sqlite
      LANGGRAPH_STRICT_MSGPACK: "true"
    volumes:
      - agent-checkpoint-data:/data
    depends_on:
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: anti-fraud-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anti-fraud-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=anti_fraud
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - AI_SERVICE_URL=http://ai-service:5000
      - AGENT_SERVICE_URL=http://agent-service:8001
      - AGENT_SERVICE_TOKEN=${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}
      - FILE_UPLOAD_PATH=/app/files/
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret-in-production}
      - JWT_EXPIRE_HOURS=24
      - JAVA_OPTS=-Xms256m -Xmx512m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
      agent-service:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - file-data:/app/files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  #  Nginx (Reverse Proxy + Frontend)
  #  Nginx 反向代理 + 前端
  # ============================================================
  nginx:
    image: anti-fraud-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: anti-fraud-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - file-data:/app/files
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_started

# ============================================================
#  Volumes
#  数据卷
# ============================================================
volumes:
  mysql-data:
  redis-data:
  agent-checkpoint-data:
  file-data:
