<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能反诈骗检测平台</title>
    <link rel="stylesheet" href="/web/css/style.css">
</head>
<body>

<!-- ===================== 登录页 ===================== -->
<div id="login-view" class="login-view">
    <div class="login-bg">
        <div class="bg-grid"></div>
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>
    </div>
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <h1>智能反诈骗<br><span>检测平台</span></h1>
            <p class="login-subtitle">AI Anti-Fraud Detection Platform</p>
        </div>
        <form id="login-form" class="login-form" autocomplete="off">
            <div class="form-item">
                <label>用户名</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="login-username" placeholder="请输入用户名" value="admin">
                </div>
            </div>
            <div class="form-item">
                <label>密码</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="login-password" placeholder="请输入密码" value="123456">
                </div>
            </div>
            <div id="login-error" class="login-error"></div>
            <button type="submit" id="login-btn" class="btn-primary btn-block">
                <span class="btn-text">登 录</span>
                <span class="btn-spinner" style="display:none"></span>
            </button>
            <p class="login-tip">默认账号 admin / 123456</p>
        </form>
    </div>
    <div class="login-footer">基于多模态深度学习的诈骗识别系统 · 毕业设计</div>
</div>

<!-- ===================== 主应用 ===================== -->
<div id="app-view" class="app-view" style="display:none">
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo-sm">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <span class="sidebar-title">反诈骗检测平台</span>
        </div>
        <nav class="menu" id="menu">
            <a class="menu-item" data-route="dashboard">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>数据仪表盘</span>
            </a>
            <a class="menu-item" data-route="text">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"/><path d="M9 20h6"/><path d="M12 17v3"/><path d="M5 7h14v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7z"/></svg>
                <span>文本诈骗检测</span>
            </a>
            <a class="menu-item" data-route="voice">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
                <span>语音诈骗检测</span>
            </a>
            <a class="menu-item" data-route="image">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <span>图像诈骗检测</span>
            </a>
            <a class="menu-item" data-route="fusion">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                <span>多模态融合检测</span>
            </a>
            <a class="menu-item" data-route="records">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span>检测记录查询</span>
            </a>
        </nav>
        <div class="sidebar-status">
            <span class="status-dot" id="svc-dot"></span>
            <span id="svc-text">系统状态检测中…</span>
        </div>
    </aside>

    <!-- 右侧主区 -->
    <div class="main-wrap">
        <header class="topbar">
            <div class="topbar-title" id="topbar-title">数据仪表盘</div>
            <div class="topbar-right">
                <div class="health-mini" id="health-mini" title="点击查看系统健康状态"></div>
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">A</div>
                    <div class="user-meta">
                        <span class="user-name" id="user-name">admin</span>
                        <span class="user-role">系统用户</span>
                    </div>
                </div>
                <button class="btn-logout" id="btn-logout" title="退出登录">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    退出
                </button>
            </div>
        </header>
        <main class="content" id="content"></main>
    </div>
</div>

<!-- Toast 提示 -->
<div id="toast-container" class="toast-container"></div>

<!-- 全局 Loading -->
<div id="global-loading" class="global-loading" style="display:none">
    <div class="loading-box">
        <div class="loading-spinner"></div>
        <span id="loading-text">正在处理…</span>
    </div>
</div>

<script src="/web/js/app.js?v=20261018"></script>
</body>
</html>
