# ============================================================
#  Nginx Configuration
#  AI反诈骗检测系统 - Nginx反向代理
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ============================================================
    #  Upstream servers
    #  上游服务器
    # ============================================================

    upstream backend {
        server backend:9090;
    }

    upstream ai_service {
        server ai-service:5000;
    }

    # ============================================================
    #  Main server
    #  主服务
    # ============================================================

    server {
        listen 80;
        server_name _;

        # Frontend static files
        # 前端静态文件
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;  # Vue Router history mode
        }

        # Backend API proxy
        # 后端API代理
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;

            # CORS headers (if frontend is on different port in dev)
            # CORS头（开发环境前后端不同端口时）
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "token, Content-Type, Authorization" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Health check endpoint
        # 健康检查端点
        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
        }

        # AI service direct access (optional, for monitoring)
        # AI服务直接访问（可选，用于监控）
        location /ai/ {
            proxy_pass http://ai_service/api/;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # File upload/download
        # 文件上传下载
        location /files/ {
            alias /app/files/;
            autoindex off;
        }

        # Deny access to hidden files
        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
        }
    }
}
